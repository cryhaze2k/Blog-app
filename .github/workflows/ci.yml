name: Node.js CI

on:
  push:
    branches: [ "main", "feature/ci-implementation" ]
  pull_request:
    branches: [ "main" ]

# Додаємо права для запису результатів аналізу якості
permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run Code Linting (Style Check)
      run: npm run lint --if-present

    - name: Run Unit Tests
      run: npm test

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL (Quality Analysis)
      uses: github/codeql-action/init@v3
      with:
        languages: 'javascript'

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3